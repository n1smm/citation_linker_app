[project]
name = "qtapp"
version = "0.1.0"
description = "Qt app for citation linker"
authors = [{name = "n1smm", email = "nomail@please.com"}]
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "pymupdf>=1.26.7",
    "pyside6>=6.10.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qtapp = ["styles/*.qss", "styles/fonts/**/*.ttf", "styles/fonts/**/*.otf", "styles/icons/*.svg", "styles/icons/*.png"]

[project.scripts]
citation-linker-app = "qtapp.main:main"
